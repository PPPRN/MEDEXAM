<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MedExam</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif}
  input,textarea,button{font-family:inherit}
  input::placeholder,textarea::placeholder{color:#C7C7CC}
  input:focus,textarea:focus{outline:none;border-color:#007AFF!important;box-shadow:0 0 0 3px rgba(0,122,255,0.13)!important}
  button:active{opacity:0.7}
  @media print{body *{visibility:hidden!important}body{background:white!important}}
  ::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// ── CONFIG ──────────────────────────────────────
const API_URL="https://script.google.com/macros/s/AKfycbxBmQjkyxudIuKx3KckZXXKP_MTs6SJXgKByoN_fTz5jyH03uIeZttrixrMeTpJkhfo/exec";

// ── SHEET API ────────────────────────────────────
async function sg(params){
  const qs=Object.keys(params).map(k=>k+"="+encodeURIComponent(params[k])).join("&");
  try{const r=await fetch(API_URL+"?"+qs);const t=await r.text();return JSON.parse(t);}
  catch(e){return{ok:false,error:e.message};}
}
async function sp(body){
  try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)});const t=await r.text();return JSON.parse(t);}
  catch(e){return{ok:false,error:e.message};}
}

// ── COLORS ───────────────────────────────────────
const C={bg:"#F2F2F7",white:"#fff",text:"#1C1C1E",sub:"#8E8E93",border:"#E5E5EA",
  blue:"#007AFF",green:"#34C759",orange:"#FF9500",red:"#FF3B30",purple:"#5856D6"};
const TC={MCQ:C.blue,MEQ:C.green,OSCE:C.orange};
const UCOLS=["#007AFF","#5856D6","#34C759","#FF9500","#FF2D55","#00C7BE"];
const ucol=n=>{let h=0;for(const c of(n||""))h+=c.charCodeAt(0);return UCOLS[h%UCOLS.length];};

// ── STYLES ───────────────────────────────────────
const S={
  app:{fontFamily:"inherit",background:C.bg,minHeight:"100vh",width:"100%"},
  nav:(ls)=>({background:"rgba(255,255,255,0.88)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderBottom:"0.5px solid "+C.border,padding:ls?"8px 16px":"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:200}),
  navTit:{fontSize:17,fontWeight:600,color:C.text,letterSpacing:-0.3,flex:1,textAlign:"center"},
  navBtn:{background:"none",border:"none",cursor:"pointer",color:C.blue,fontSize:15,fontWeight:500,display:"flex",alignItems:"center",gap:3,padding:"4px 2px",fontFamily:"inherit",minWidth:60},
  page:(ls)=>({padding:ls?"10px 14px 60px":"14px 14px 90px",maxWidth:680,margin:"0 auto"}),
  card:{background:C.white,borderRadius:16,padding:16,marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"},
  row:{display:"flex",alignItems:"center",padding:"13px 14px",background:C.white,borderRadius:14,marginBottom:8,cursor:"pointer",border:"none",width:"100%",textAlign:"left",fontFamily:"inherit",boxShadow:"0 1px 3px rgba(0,0,0,0.06)"},
  input:{width:"100%",padding:"12px 14px",borderRadius:12,border:"1px solid "+C.border,fontSize:16,fontFamily:"inherit",background:C.white,color:C.text,boxSizing:"border-box"},
  ta:{width:"100%",padding:"12px 14px",borderRadius:12,border:"1px solid "+C.border,fontSize:15,fontFamily:"inherit",background:C.white,color:C.text,resize:"vertical",minHeight:80,boxSizing:"border-box"},
  btnP:{background:C.blue,color:"white",border:"none",borderRadius:14,padding:"14px 20px",fontSize:16,fontWeight:600,cursor:"pointer",width:"100%",fontFamily:"inherit"},
  btnS:{background:C.bg,color:C.blue,border:"none",borderRadius:14,padding:"14px 20px",fontSize:16,fontWeight:600,cursor:"pointer",width:"100%",fontFamily:"inherit"},
  btnR:{background:C.red,color:"white",border:"none",borderRadius:14,padding:"13px 20px",fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit",flex:1},
  lbl:{fontSize:12,fontWeight:600,color:C.sub,marginBottom:6,letterSpacing:0.4,textTransform:"uppercase"},
  overlay:{position:"fixed",inset:0,background:"rgba(0,0,0,0.48)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"},
  sheet:(ls)=>({background:C.white,borderRadius:"22px 22px 0 0",padding:"16px 18px 44px",width:"100%",maxWidth:680,maxHeight:ls?"96vh":"88vh",overflowY:"auto"}),
  hdl:{width:36,height:5,background:C.border,borderRadius:3,margin:"0 auto 18px"},
  stit:{fontSize:20,fontWeight:700,color:C.text,marginBottom:18,letterSpacing:-0.4},
  badge:(col)=>({background:col+"22",color:col,borderRadius:8,padding:"3px 9px",fontSize:12,fontWeight:700}),
};

// ── LAYOUT HOOK ──────────────────────────────────
function useLayout(){
  const [ls,setLs]=useState(()=>window.innerWidth>window.innerHeight);
  useEffect(()=>{
    const u=()=>setLs(window.innerWidth>window.innerHeight);
    window.addEventListener("resize",u);window.addEventListener("orientationchange",u);
    return()=>{window.removeEventListener("resize",u);window.removeEventListener("orientationchange",u);};
  },[]);
  return{landscape:ls};
}

// ── MINI COMPONENTS ──────────────────────────────
function Spin(){return <div style={{display:"flex",justifyContent:"center",padding:48}}><div style={{width:32,height:32,borderRadius:"50%",border:"3px solid #E5E5EA",borderTopColor:C.blue,animation:"sp .7s linear infinite"}}/><style>{`@keyframes sp{to{transform:rotate(360deg)}}`}</style></div>;}

function Toast({msg,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t);},[]);
  return <div style={{position:"fixed",bottom:88,left:"50%",transform:"translateX(-50%)",background:"#1C1C1E",color:"white",borderRadius:14,padding:"11px 20px",fontSize:14,fontWeight:500,zIndex:900,maxWidth:"88vw",textAlign:"center",boxShadow:"0 6px 24px rgba(0,0,0,0.28)"}}>{msg}</div>;
}

function Confirm({title,msg,onOk,onCancel,okLabel="Delete",color=C.red}){
  const{landscape}=useLayout();
  return <div style={S.overlay} onClick={onCancel}>
    <div style={S.sheet(landscape)} onClick={e=>e.stopPropagation()}>
      <div style={S.hdl}/>
      <div style={{...S.stit,color}}>{title}</div>
      <p style={{color:C.sub,marginBottom:24,lineHeight:1.55,fontSize:15}}>{msg}</p>
      <div style={{display:"flex",gap:10}}>
        <button style={S.btnS} onClick={onCancel}>Cancel</button>
        <button style={{...S.btnR,background:color}} onClick={onOk}>{okLabel}</button>
      </div>
    </div>
  </div>;
}

function PwField({value,onChange,placeholder="Password",inputStyle={}}){
  const[show,setShow]=useState(false);
  return <div style={{position:"relative"}}>
    <input type={show?"text":"password"} value={value} onChange={onChange} placeholder={placeholder} style={{...S.input,paddingRight:46,...inputStyle}}/>
    <button onClick={()=>setShow(!show)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:C.sub,fontSize:18}}>
      {show?"🙈":"👁"}
    </button>
  </div>;
}

function Avatar({name,size=34}){
  const col=ucol(name);
  const ini=(name||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return <div style={{width:size,height:size,borderRadius:size/2,background:col+"22",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
    <span style={{fontSize:size*0.38,fontWeight:700,color:col}}>{ini}</span>
  </div>;
}

function timeAgo(ts){
  const d=(Date.now()-ts)/1000;
  if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";
  if(d<86400)return Math.floor(d/3600)+"h ago";return new Date(ts).toLocaleDateString();
}

// ── WATERMARK ────────────────────────────────────
function Watermark({name}){
  const tiles=[];
  for(let i=0;i<36;i++)tiles.push(i);
  return <div aria-hidden style={{position:"fixed",inset:0,zIndex:9999,pointerEvents:"none",overflow:"hidden",transform:"rotate(-22deg)",transformOrigin:"center center",margin:"-40% -20%",width:"140%",height:"180%",display:"grid",gridTemplateColumns:"repeat(3,1fr)",gridTemplateRows:"repeat(12,1fr)",alignItems:"center",justifyItems:"center"}}>
    {tiles.map(i=><div key={i} style={{fontSize:15,fontWeight:700,color:"rgba(0,0,0,0.08)",letterSpacing:2,whiteSpace:"nowrap",userSelect:"none"}}>{name.toUpperCase()}</div>)}
  </div>;
}

// ── COMMENTS ─────────────────────────────────────
function Comments({comments=[],qid,qnum,me,subject,onRefresh}){
  const[text,setText]=useState("");
  const submit=async()=>{
    if(!text.trim())return;
    const r=await sp({action:"addComment",subject,questionNum:qnum,userName:me.name,text:text.trim()});
    if(r.ok){setText("");onRefresh();}
  };
  const del=async(cm)=>{
    await sp({action:"deleteComment",subject,questionNum:qnum,userName:cm.userName,text:cm.text});
    onRefresh();
  };
  return <div style={{borderTop:"1px solid "+C.border,paddingTop:14,marginTop:6}}>
    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12}}>
      <span style={{fontSize:12,fontWeight:700,color:C.sub,letterSpacing:0.4,textTransform:"uppercase"}}>💬 Comments{comments.length>0?" ("+comments.length+")":""}</span>
    </div>
    {comments.length===0&&<p style={{fontSize:13,color:"#AEAEB2",marginBottom:10}}>No comments yet.</p>}
    {comments.map((cm,i)=><div key={i} style={{display:"flex",gap:9,marginBottom:11}}>
      <Avatar name={cm.userName} size={30}/>
      <div style={{flex:1,background:C.bg,borderRadius:12,padding:"8px 11px"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
          <span style={{fontSize:13,fontWeight:700,color:C.text}}>{cm.userName}</span>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:11,color:C.sub}}>{timeAgo(cm.ts)}</span>
            {cm.userName===me.name&&<button onClick={()=>del(cm)} style={{background:"none",border:"none",cursor:"pointer",color:C.red,fontSize:13}}>✕</button>}
          </div>
        </div>
        <p style={{fontSize:14,color:C.text,margin:0,lineHeight:1.5}}>{cm.text}</p>
      </div>
    </div>)}
    <div style={{display:"flex",gap:8,alignItems:"center",marginTop:4}}>
      <Avatar name={me.name} size={30}/>
      <div style={{flex:1,background:C.bg,borderRadius:20,padding:"7px 12px",display:"flex",alignItems:"center",gap:6}}>
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit();}}} placeholder="Write a comment…" style={{flex:1,background:"none",border:"none",outline:"none",fontSize:14,fontFamily:"inherit",color:C.text}}/>
        <button onClick={submit} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:text.trim()?C.blue:"#C7C7CC"}}>➤</button>
      </div>
    </div>
  </div>;
}

// ── LOGIN ─────────────────────────────────────────
function LoginPage({users,onLogin}){
  const[sel,setSel]=useState(null);
  const[pw,setPw]=useState("");
  const[err,setErr]=useState("");
  const go=()=>{
    if(!sel){setErr("Select a user");return;}
    const u=users.find(x=>x.id===sel);
    if(u?.password!==pw){setErr("Wrong password");setPw("");return;}
    onLogin(u);
  };
  return <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#0d1117 0%,#161b22 55%,#0d2137 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:24,overflowY:"auto"}}>
    <div style={{width:"100%",maxWidth:340}}>
      <div style={{textAlign:"center",marginBottom:40}}>
        <div style={{width:80,height:80,borderRadius:22,background:"linear-gradient(135deg,#007AFF,#5856D6)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",boxShadow:"0 10px 40px rgba(0,122,255,0.35)",fontSize:38}}>🧠</div>
        <h1 style={{color:"white",fontSize:28,fontWeight:700,letterSpacing:-0.6,margin:0}}>MedExam</h1>
        <p style={{color:"rgba(255,255,255,0.4)",fontSize:14,marginTop:5}}>Medical Exam Repository</p>
      </div>
      <p style={{color:"rgba(255,255,255,0.5)",fontSize:12,fontWeight:600,letterSpacing:0.5,textTransform:"uppercase",marginBottom:10}}>Select Account</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18}}>
        {users.map(u=><button key={u.id} onClick={()=>{setSel(u.id);setErr("");setPw("");}} style={{padding:"9px 16px",borderRadius:12,border:"2px solid "+(sel===u.id?C.blue:"rgba(255,255,255,0.12)"),background:sel===u.id?"rgba(0,122,255,0.18)":"rgba(255,255,255,0.05)",color:"white",fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:8}}>
          <Avatar name={u.name} size={24}/>{u.name}
        </button>)}
      </div>
      {sel&&<div style={{marginBottom:14}}>
        <PwField value={pw} onChange={e=>{setPw(e.target.value);setErr("");}} inputStyle={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.18)",color:"white"}}/>
      </div>}
      {err&&<p style={{color:"#FF453A",fontSize:13,marginBottom:10}}>⚠ {err}</p>}
      <button style={{...S.btnP,background:sel?"linear-gradient(135deg,#007AFF,#5856D6)":"rgba(255,255,255,0.08)",color:sel?"white":"rgba(255,255,255,0.25)",marginTop:4}} onClick={go}>Sign In</button>
    </div>
  </div>;
}

// ── SUBJECTS ──────────────────────────────────────
function SubjectsPage({subjects,onSelect,onAdd,onDelete,onSettings}){
  const{landscape}=useLayout();
  const[showAdd,setShowAdd]=useState(false);
  const[name,setName]=useState("");
  const[conf,setConf]=useState(null);
  const add=()=>{if(!name.trim())return;onAdd(name.trim());setName("");setShowAdd(false);};
  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={S.nav(landscape)}>
      <div style={{minWidth:60}}/>
      <span style={S.navTit}>📚 Subjects</span>
      <div style={{display:"flex",gap:12,minWidth:60,justifyContent:"flex-end"}}>
        <button style={S.navBtn} onClick={onSettings}><span style={{fontSize:20}}>⚙️</span></button>
        <button style={S.navBtn} onClick={()=>setShowAdd(true)}><span style={{fontSize:24}}>＋</span></button>
      </div>
    </div>
    <div style={S.page(landscape)}>
      {subjects.length===0?<div style={{textAlign:"center",paddingTop:80,color:C.sub}}>
        <div style={{fontSize:52}}>🩺</div>
        <p style={{marginTop:14,fontSize:17,fontWeight:500}}>No subjects yet</p>
        <p style={{fontSize:14,marginTop:4}}>Tap ＋ to add your first subject</p>
      </div>:subjects.map(s=><button key={s.id} style={S.row} onClick={()=>onSelect(s)}>
        <div style={{width:44,height:44,borderRadius:12,background:"#007AFF18",display:"flex",alignItems:"center",justifyContent:"center",marginRight:14,fontSize:22}}>🩺</div>
        <div style={{flex:1}}>
          <div style={{fontSize:16,fontWeight:600,color:C.text}}>{s.name}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={e=>{e.stopPropagation();setConf(s);}} style={{background:"none",border:"none",cursor:"pointer",color:C.red,padding:4,fontSize:16}}>🗑</button>
          <span style={{color:"#C7C7CC",fontSize:18}}>›</span>
        </div>
      </button>)}
    </div>
    {showAdd&&<div style={S.overlay} onClick={()=>setShowAdd(false)}>
      <div style={S.sheet(landscape)} onClick={e=>e.stopPropagation()}>
        <div style={S.hdl}/>
        <div style={S.stit}>New Subject</div>
        <p style={S.lbl}>Subject Name</p>
        <input style={{...S.input,marginBottom:20}} placeholder="e.g. Internal Medicine" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} autoFocus/>
        <div style={{display:"flex",gap:10}}>
          <button style={S.btnS} onClick={()=>setShowAdd(false)}>Cancel</button>
          <button style={S.btnP} onClick={add}>Add</button>
        </div>
      </div>
    </div>}
    {conf&&<Confirm title="Delete Subject" msg={"Delete \""+conf.name+"\" and all its questions?"} onOk={()=>{onDelete(conf);setConf(null);}} onCancel={()=>setConf(null)}/>}
  </div>;
}

// ── TOPICS ────────────────────────────────────────
function TopicsPage({subject,questions,onBack,onTopic,onSettings}){
  const{landscape}=useLayout();
  const cnt=t=>questions.filter(q=>q.topic===t).length;
  const meta={MCQ:{icon:"📝",desc:"Multiple Choice Questions"},MEQ:{icon:"✍️",desc:"Modified Essay Questions"},OSCE:{icon:"🩺",desc:"Clinical Examination"}};
  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={S.nav(landscape)}>
      <button style={S.navBtn} onClick={onBack}>‹ Back</button>
      <span style={S.navTit}>{subject.name}</span>
      <button style={{...S.navBtn,justifyContent:"flex-end"}} onClick={onSettings}><span style={{fontSize:20}}>⚙️</span></button>
    </div>
    <div style={S.page(landscape)}>
      <p style={{...S.lbl,marginBottom:14}}>Choose Topic</p>
      {["MCQ","MEQ","OSCE"].map(t=><button key={t} style={S.row} onClick={()=>onTopic(t)}>
        <div style={{width:46,height:46,borderRadius:13,background:TC[t]+"18",display:"flex",alignItems:"center",justifyContent:"center",marginRight:14,fontSize:22}}>{meta[t].icon}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:17,fontWeight:600,color:C.text}}>{t}</div>
          <div style={{fontSize:13,color:C.sub,marginTop:2}}>{meta[t].desc}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={S.badge(TC[t])}>{cnt(t)}</span>
          <span style={{color:"#C7C7CC",fontSize:18}}>›</span>
        </div>
      </button>)}
    </div>
  </div>;
}

// ── QUESTIONS ─────────────────────────────────────
function QuestionsPage({subject,topic,questions,me,onBack,onAdd,onDelete,onRefresh,onSettings}){
  const{landscape}=useLayout();
  const[expanded,setExpanded]=useState(null);
  const[showAdd,setShowAdd]=useState(false);
  const[conf,setConf]=useState(null);
  const[toast,setToast]=useState("");
  const[dup,setDup]=useState(null);
  const[override,setOverride]=useState(false);
  const[nQ,setNQ]=useState("");const[nA,setNA]=useState("");
  const[aiLoading,setAiLoading]=useState(null);
  const fileRef=useRef();
  const list=questions.filter(q=>q.topic===topic||!q.topic);

  const sim=(a,b)=>{
    const ta=a.toLowerCase().split(/\s+/),tb=b.toLowerCase().split(/\s+/);
    const sa={},sb={};for(const w of ta)sa[w]=1;for(const w of tb)sb[w]=1;
    let inter=0;for(const w in sa)if(sb[w])inter++;
    const union=Object.keys({...sa,...sb}).length;
    return union===0?0:inter/union;
  };

  const tryAdd=()=>{
    if(!nQ.trim()||!nA.trim()){setToast("Fill in question and answer");return;}
    if(!override){
      for(const q of list){if(sim(nQ,q.question)>0.48){setDup({q,s:sim(nQ,q.question)});return;}}
    }
    onAdd({question:nQ.trim(),answer:nA.trim(),topic});
    setNQ("");setNA("");setDup(null);setOverride(false);setShowAdd(false);
  };

  const runAI=async(q)=>{
    const apiKey=localStorage.getItem("medexam_apikey")||"";
    if(!apiKey){setToast("Set your Anthropic API key in Settings first");return;}
    setAiLoading(q.id);
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({
          model:"claude-haiku-4-5-20251001",
          max_tokens:1000,
          messages:[{role:"user",content:"You are a senior medical educator. Review this "+topic+" exam question and answer.\n\nQuestion: "+q.question+"\n\nAnswer: "+q.answer+"\n\nProvide:\n**Correction:** Is the answer correct? List errors or missing points.\n**Key Knowledge:** Important concepts every student must know about this topic.\n\nBe concise and educational."}]
        })
      });
      const data=await resp.json();
      const text=data?.content?.[0]?.text||(data?.error?"Error: "+data.error.message:"No response.");
      // Save to Google Sheet
      await sp({action:"saveAICorrection",subject:subject.name,num:q.num,correction:text});
      onRefresh();
      setToast("AI correction saved ✓");
    }catch(e){setToast("AI error: "+e.message);}
    setAiLoading(null);
  };

  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={S.nav(landscape)}>
      <button style={S.navBtn} onClick={onBack}>‹ Topics</button>
      <span style={S.navTit}><span style={{color:TC[topic]}}>● </span>{topic}</span>
      <button style={{...S.navBtn,justifyContent:"flex-end"}} onClick={()=>{setShowAdd(true);setDup(null);setOverride(false);}}><span style={{fontSize:24}}>＋</span></button>
    </div>
    <div style={S.page(landscape)}>
      {list.length===0?<div style={{textAlign:"center",paddingTop:70,color:C.sub}}>
        <div style={{fontSize:48}}>🧠</div>
        <p style={{marginTop:12,fontSize:17,fontWeight:500}}>No questions yet</p>
        <p style={{fontSize:14}}>Tap ＋ to add the first question</p>
      </div>:list.map((q,i)=><div key={q.id||i} style={S.card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
          <span style={S.badge(TC[topic])}>Q{i+1}</span>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:12,color:C.sub}}>💬 {(q.comments||[]).length}</span>
            <button onClick={()=>setConf(q)} style={{background:"none",border:"none",cursor:"pointer",color:C.red,fontSize:16}}>🗑</button>
          </div>
        </div>
        <p onClick={()=>setExpanded(expanded===q.id?null:q.id)} style={{fontSize:15,fontWeight:600,color:C.text,margin:"0 0 4px",lineHeight:1.45,cursor:"pointer"}}>{q.question}</p>
        {q.addedBy&&<p style={{fontSize:11,color:C.sub,margin:"0 0 4px"}}>Added by {q.addedBy} {q.timestamp?("· "+timeAgo(q.timestamp)):""}</p>}
        {expanded===q.id&&<>
          {/* Answer */}
          <div style={{borderTop:"1px solid "+C.border,paddingTop:12,marginBottom:12}}>
            <p style={S.lbl}>Answer</p>
            <p style={{fontSize:15,color:"#3C3C43",lineHeight:1.65,margin:0}}>{q.answer}</p>
          </div>

          {/* AI Correction */}
          {q.aiCorrection?<div style={{background:"#5856D608",border:"1px solid #5856D622",borderRadius:12,padding:14,marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:14}}>✨</span>
                <span style={{fontSize:12,fontWeight:700,color:C.purple,letterSpacing:0.3,textTransform:"uppercase"}}>AI Correction</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {q.aiTimestamp&&<span style={{fontSize:11,color:C.sub}}>{timeAgo(q.aiTimestamp)}</span>}
                <button onClick={()=>runAI(q)} disabled={aiLoading===q.id} style={{background:C.purple+"18",border:"none",borderRadius:8,padding:"4px 10px",fontSize:12,fontWeight:600,color:C.purple,cursor:"pointer"}}>
                  {aiLoading===q.id?"...":"Re-run"}
                </button>
              </div>
            </div>
            <p style={{fontSize:14,color:"#3C3C43",lineHeight:1.72,whiteSpace:"pre-wrap",margin:0}}>{q.aiCorrection}</p>
          </div>:<button
            onClick={()=>runAI(q)}
            disabled={aiLoading===q.id}
            style={{...S.btnP,background:aiLoading===q.id?"#8E8E93":"linear-gradient(135deg,#5856D6,#7B68EE)",display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:12,fontSize:15}}
          >
            <span style={{fontSize:16}}>✨</span>
            {aiLoading===q.id?"Analyzing…":"Get AI Correction"}
          </button>}

          <Comments comments={q.comments||[]} qid={q.id} qnum={q.num} me={me} subject={subject.name} onRefresh={onRefresh}/>
        </>}
      </div>)}
    </div>

    {showAdd&&<div style={S.overlay} onClick={()=>{setShowAdd(false);setDup(null);setOverride(false);}}>
      <div style={S.sheet(landscape)} onClick={e=>e.stopPropagation()}>
        <div style={S.hdl}/>
        <div style={S.stit}>Add Question</div>
        {dup&&!override&&<div style={{background:"#FF950014",border:"1px solid #FF950038",borderRadius:12,padding:12,marginBottom:14}}>
          <p style={{fontSize:14,fontWeight:700,color:C.orange,margin:"0 0 4px"}}>⚠ Similar question found!</p>
          <p style={{fontSize:13,color:C.sub,margin:"0 0 10px",lineHeight:1.5}}>{Math.round(dup.s*100)}% match: "{dup.q.question.slice(0,55)}…"</p>
          <button style={{...S.btnS,padding:"7px 14px",fontSize:13,width:"auto"}} onClick={()=>{setOverride(true);setDup(null);}}>Add Anyway</button>
        </div>}
        <p style={S.lbl}>Question</p>
        <textarea style={{...S.ta,marginBottom:12}} placeholder="Enter the question…" value={nQ} onChange={e=>setNQ(e.target.value)}/>
        <p style={S.lbl}>Answer</p>
        <textarea style={{...S.ta,marginBottom:16}} placeholder="Enter the answer…" value={nA} onChange={e=>setNA(e.target.value)}/>
        <div style={{display:"flex",gap:10}}>
          <button style={S.btnS} onClick={()=>{setShowAdd(false);setDup(null);setOverride(false);}}>Cancel</button>
          <button style={S.btnP} onClick={tryAdd}>Add Question</button>
        </div>
      </div>
    </div>}

    {conf&&<Confirm title="Delete Question" msg="Delete this question permanently?" onOk={()=>{onDelete(conf);setConf(null);setToast("Deleted");}} onCancel={()=>setConf(null)}/>}
    {toast&&<Toast msg={toast} onClose={()=>setToast("")}/>}
  </div>;
}

// ── SETTINGS ──────────────────────────────────────
function SettingsPage({users,me,sheetLink,onBack,onUpdateUsers,onUpdateSheetLink,onLogout}){
  const{landscape}=useLayout();
  const[tab,setTab]=useState("general");
  const[editing,setEditing]=useState(null);
  const[adminGate,setAdminGate]=useState(false);
  const[adminGateFor,setAdminGateFor]=useState("addUser");
  const[showAdd,setShowAdd]=useState(false);
  const[showSheet,setShowSheet]=useState(false);
  const[gatePw,setGatePw]=useState("");const[gateErr,setGateErr]=useState("");
  const[eName,setEName]=useState("");const[ePw,setEPw]=useState("");
  const[nName,setNName]=useState("");const[nPw,setNPw]=useState("");
  const[linkInput,setLinkInput]=useState(sheetLink||"");
  const[toast,setToast]=useState("");
  const[conf,setConf]=useState(null);
  const[apiKey,setApiKey]=useState(()=>{try{return localStorage.getItem("medexam_apikey")||"";}catch{return"";}});
  const[showApiKey,setShowApiKey]=useState(false);
  const admin=users[0];

  const openAddGate=()=>{setGatePw("");setGateErr("");setAdminGateFor("addUser");setAdminGate(true);};
  const openSheetGate=()=>{setGatePw("");setGateErr("");setAdminGateFor("sheet");setAdminGate(true);};
  const confirmGate=()=>{
    if(gatePw!==admin.password){setGateErr("Wrong admin password");return;}
    setAdminGate(false);
    if(adminGateFor==="addUser")setShowAdd(true);
    if(adminGateFor==="sheet"){setShowSheet(true);setLinkInput(sheetLink||"");}
  };
  const saveEdit=()=>{
    if(!eName.trim()||!ePw.trim()){setToast("Fill all fields");return;}
    onUpdateUsers(users.map(u=>u.id===editing.id?{...u,name:eName.trim(),password:ePw.trim()}:u));
    setEditing(null);setToast("Updated ✓");
  };
  const addUser=()=>{
    if(!nName.trim()||!nPw.trim()){setToast("Fill all fields");return;}
    onUpdateUsers([...users,{id:"u"+Date.now(),name:nName.trim(),password:nPw.trim()}]);
    setNName("");setNPw("");setShowAdd(false);setToast("User added ✓");
  };
  const delUser=u=>{
    if(users.length<=1){setToast("Cannot delete the only user");return;}
    onUpdateUsers(users.filter(x=>x.id!==u.id));setConf(null);setToast("Deleted");
  };
  const saveSheetLink=()=>{onUpdateSheetLink(linkInput.trim());setShowSheet(false);setToast("Saved ✓");};

  return <div style={{background:C.bg,minHeight:"100vh"}}>
    <div style={S.nav(landscape)}>
      <button style={S.navBtn} onClick={onBack}>‹ Back</button>
      <span style={S.navTit}>Settings</span>
      <div style={{minWidth:60}}/>
    </div>

    <div style={{display:"flex",margin:"12px 14px 0",background:C.border,borderRadius:12,padding:3,gap:3}}>
      {[["general","General"],["export","Export"]].map(([key,label])=><button key={key} onClick={()=>setTab(key)} style={{flex:1,padding:"8px 0",borderRadius:9,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:600,background:tab===key?C.white:"transparent",color:tab===key?C.text:C.sub,boxShadow:tab===key?"0 1px 4px rgba(0,0,0,0.1)":"none"}}>{label}</button>)}
    </div>

    <div style={S.page(landscape)}>
    {tab==="export"?<>
      <div style={S.card}>
        <p style={{fontSize:15,fontWeight:700,color:C.text,margin:"0 0 8px"}}>📦 Get Source Code</p>
        <p style={{fontSize:13,color:C.sub,lineHeight:1.7,margin:0,whiteSpace:"pre-line"}}>{"1. Go to Claude.ai in your browser\n2. Find this MedExam conversation\n3. Download the MedExam.html file\n4. Open it directly in Safari\n\nNo installation needed!"}</p>
      </div>
    </>:<>
      <div style={{...S.card,background:"linear-gradient(135deg,#007AFF,#5856D6)",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:50,height:50,borderRadius:14,background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>👤</div>
          <div>
            <p style={{color:"rgba(255,255,255,0.65)",fontSize:12,fontWeight:600,margin:0,letterSpacing:0.3}}>SIGNED IN AS</p>
            <p style={{color:"white",fontSize:19,fontWeight:700,margin:"2px 0 0"}}>{me.name}</p>
          </div>
        </div>
      </div>

      <div style={{...S.card,display:"flex",alignItems:"center",gap:10,marginBottom:16,padding:"12px 14px"}}>
        <span style={{fontSize:20}}>🛡</span>
        <div style={{flex:1}}>
          <p style={{margin:0,fontSize:14,fontWeight:600,color:C.text}}>Admin Account</p>
          <p style={{margin:0,fontSize:12,color:C.sub}}>"{admin.name}" — required to add users</p>
        </div>
      </div>

      <p style={S.lbl}>AI Correction</p>
      <div style={{...S.card,marginBottom:20,padding:"14px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{width:38,height:38,borderRadius:10,background:C.purple+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>✨</div>
          <div style={{flex:1}}>
            <p style={{margin:0,fontSize:15,fontWeight:700,color:C.text}}>Anthropic API Key</p>
            <p style={{margin:0,fontSize:12,color:C.sub}}>{apiKey?"Key set ✓":"Required for AI correction"}</p>
          </div>
        </div>
        <p style={{fontSize:12,color:C.sub,lineHeight:1.5,margin:"0 0 10px"}}>
          Get your key at <a href="https://console.anthropic.com" target="_blank" style={{color:C.blue}}>console.anthropic.com</a>
        </p>
        <div style={{position:"relative",marginBottom:10}}>
          <input type={showApiKey?"text":"password"} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-..." style={{...S.input,paddingRight:46,fontFamily:"monospace",fontSize:13}}/>
          <button onClick={()=>setShowApiKey(!showApiKey)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16}}>{showApiKey?"🙈":"👁"}</button>
        </div>
        <button style={{...S.btnP,padding:"11px 20px",fontSize:14}} onClick={()=>{try{localStorage.setItem("medexam_apikey",apiKey.trim());}catch{}setToast("API key saved ✓");}}>
          Save API Key
        </button>
      </div>

      <p style={S.lbl}>Google Sheet</p>
      <div style={{...S.card,marginBottom:20,padding:"14px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <div style={{width:38,height:38,borderRadius:10,background:"#34A85320",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>📊</div>
          <div style={{flex:1}}>
            <p style={{margin:0,fontSize:15,fontWeight:700,color:C.text}}>Reference Sheet</p>
            <p style={{margin:0,fontSize:12,color:C.sub}}>{sheetLink?"Connected ✓":"Not set"}</p>
          </div>
          {sheetLink&&<a href={sheetLink} target="_blank" rel="noreferrer" style={{background:C.green+"18",color:C.green,borderRadius:10,padding:"7px 14px",fontSize:13,fontWeight:600,textDecoration:"none"}}>Open ↗</a>}
        </div>
        {showSheet?<>
          <p style={S.lbl}>Sheet URL</p>
          <input style={{...S.input,marginBottom:12,fontSize:13}} placeholder="https://docs.google.com/spreadsheets/..." value={linkInput} onChange={e=>setLinkInput(e.target.value)}/>
          <div style={{display:"flex",gap:10}}>
            <button style={S.btnS} onClick={()=>setShowSheet(false)}>Cancel</button>
            <button style={S.btnP} onClick={saveSheetLink}>Save</button>
          </div>
        </>:<button style={{...S.btnS,display:"flex",alignItems:"center",justifyContent:"center",gap:7,padding:"10px 16px",fontSize:14}} onClick={openSheetGate}>
          🔒 {sheetLink?"Edit Link (Admin)":"Set Link (Admin)"}
        </button>}
      </div>

      <p style={S.lbl}>Users</p>
      {users.map(u=><div key={u.id} style={{...S.card,padding:"12px 14px",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center"}}>
          <Avatar name={u.name} size={40}/>
          <div style={{flex:1,marginLeft:12}}>
            <p style={{fontSize:16,fontWeight:600,color:C.text,margin:0}}>{u.name}</p>
            <p style={{fontSize:13,color:C.sub,margin:"2px 0 0"}}>{"•".repeat(Math.min(u.password.length,8))}</p>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setEditing(u);setEName(u.name);setEPw(u.password);}} style={{background:C.blue+"15",border:"none",borderRadius:9,padding:8,cursor:"pointer",fontSize:15}}>✏️</button>
            {users.length>1&&<button onClick={()=>setConf(u)} style={{background:C.red+"15",border:"none",borderRadius:9,padding:8,cursor:"pointer",fontSize:15}}>🗑</button>}
          </div>
        </div>
      </div>)}

      <button style={{...S.btnS,display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginTop:8,marginBottom:28}} onClick={openAddGate}>
        ➕ Add New User
      </button>
      <button style={{...S.btnR,width:"100%"}} onClick={onLogout}>Sign Out</button>
    </>}
    </div>

    {adminGate&&<div style={S.overlay} onClick={()=>setAdminGate(false)}>
      <div style={S.sheet(landscape)} onClick={e=>e.stopPropagation()}>
        <div style={S.hdl}/>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>
          <div style={{width:44,height:44,borderRadius:12,background:C.orange+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🔒</div>
          <div>
            <p style={{fontSize:17,fontWeight:700,color:C.text,margin:0}}>Admin Required</p>
            <p style={{fontSize:13,color:C.sub,margin:"3px 0 0"}}>Enter "{admin.name}"'s password</p>
          </div>
        </div>
        <PwField value={gatePw} onChange={e=>{setGatePw(e.target.value);setGateErr("");}} placeholder="Admin password"/>
        {gateErr&&<p style={{color:C.red,fontSize:13,marginTop:8}}>⚠ {gateErr}</p>}
        <div style={{display:"flex",gap:10,marginTop:16}}>
          <button style={S.btnS} onClick={()=>setAdminGate(false)}>Cancel</button>
          <button style={{...S.btnP,background:C.orange}} onClick={confirmGate}>Confirm</button>
        </div>
      </div>
    </div>}

    {editing&&<div style={S.overlay} onClick={()=>setEditing(null)}>
      <div style={S.sheet(landscape)} onClick={e=>e.stopPropagation()}>
        <div style={S.hdl}/>
        <div style={S.stit}>Edit User</div>
        <p style={S.lbl}>Name</p>
        <input style={{...S.input,marginBottom:14}} value={eName} onChange={e=>setEName(e.target.value)}/>
        <p style={S.lbl}>Password</p>
        <PwField value={ePw} onChange={e=>setEPw(e.target.value)}/>
        <div style={{display:"flex",gap:10,marginTop:18}}>
          <button style={S.btnS} onClick={()=>setEditing(null)}>Cancel</button>
          <button style={S.btnP} onClick={saveEdit}>Save</button>
        </div>
      </div>
    </div>}

    {showAdd&&<div style={S.overlay} onClick={()=>setShowAdd(false)}>
      <div style={S.sheet(landscape)} onClick={e=>e.stopPropagation()}>
        <div style={S.hdl}/>
        <div style={S.stit}>New User</div>
        <p style={S.lbl}>Name</p>
        <input style={{...S.input,marginBottom:14}} placeholder="Username" value={nName} onChange={e=>setNName(e.target.value)}/>
        <p style={S.lbl}>Password</p>
        <PwField value={nPw} onChange={e=>setNPw(e.target.value)} placeholder="Set password"/>
        <div style={{display:"flex",gap:10,marginTop:18}}>
          <button style={S.btnS} onClick={()=>setShowAdd(false)}>Cancel</button>
          <button style={S.btnP} onClick={addUser}>Add User</button>
        </div>
      </div>
    </div>}

    {conf&&<Confirm title="Delete" msg={"Remove \""+conf.name+"\"?"} onOk={()=>delUser(conf)} onCancel={()=>setConf(null)}/>}
    {toast&&<Toast msg={toast} onClose={()=>setToast("")}/>}
  </div>;
}

// ── ROOT ──────────────────────────────────────────
function App(){
  const[users,setUsers]=useState([]);
  const[subjects,setSubjects]=useState([]);
  const[questions,setQuestions]=useState([]);
  const[ready,setReady]=useState(false);
  const[user,setUser]=useState(null);
  const[page,setPage]=useState("login");
  const[subject,setSubject]=useState(null);
  const[topic,setTopic]=useState(null);
  const[loading,setLoading]=useState("");
  const[toast,setToast]=useState("");
  const[sheetLink,setSheetLink]=useState(()=>{try{return localStorage.getItem("medexam_sheet")||"";}catch{return"";}});

  useEffect(()=>{
    setLoading("Connecting to Google Sheets…");
    sg({action:"getUsers"}).then(r=>{
      if(r.ok&&r.users)setUsers(r.users);
      else setToast("Sheet error: "+(r.error||"unknown"));
    }).catch(e=>setToast("Cannot connect: "+e.message))
    .finally(()=>{setLoading("");setReady(true);});
  },[]);

  const loadSubjects=useCallback(async()=>{
    setLoading("Loading subjects…");
    const r=await sg({action:"getSubjects"});
    if(r.ok)setSubjects((r.subjects||[]).map((n,i)=>({id:"s_"+i+"_"+n,name:n})));
    setLoading("");
  },[]);

  const loadQuestions=useCallback(async(subjectName)=>{
    setLoading("Loading questions…");
    const r=await sg({action:"getQuestions",subject:subjectName});
    if(r.ok)setQuestions(r.questions||[]);
    else setToast("Error: "+r.error);
    setLoading("");
  },[]);

  const addSubject=async(name)=>{
    setLoading("Creating…");
    const r=await sp({action:"addSubject",name});
    if(r.ok){await loadSubjects();setToast("Subject added ✓");}
    else setToast("Error: "+r.error);
    setLoading("");
  };

  const delSubject=async(s)=>{
    setLoading("Deleting…");
    const r=await sp({action:"deleteSubject",name:s.name});
    if(r.ok){await loadSubjects();setToast("Deleted");}
    else setToast("Error: "+r.error);
    setLoading("");
  };

  const addQuestion=async(q)=>{
    setLoading("Saving…");
    const r=await sp({action:"addQuestion",subject:subject.name,question:q.question,answer:q.answer,addedBy:user.name,topic:q.topic});
    if(r.ok){await loadQuestions(subject.name);setToast("Question added ✓");}
    else setToast("Error: "+r.error);
    setLoading("");
  };

  const delQuestion=async(q)=>{
    setLoading("Deleting…");
    const r=await sp({action:"deleteQuestion",subject:subject.name,num:q.num});
    if(r.ok){await loadQuestions(subject.name);setToast("Deleted");}
    else setToast("Error: "+r.error);
    setLoading("");
  };

  const updateUsers=async(updated)=>{
    for(const u of updated){
      const old=users.find(x=>x.id===u.id);
      if(!old)await sp({action:"addUser",name:u.name,password:u.password});
      else if(old.name!==u.name||old.password!==u.password)await sp({action:"updateUser",oldName:old.name,newName:u.name,newPassword:u.password});
    }
    for(const old of users){if(!updated.find(u=>u.id===old.id))await sp({action:"deleteUser",name:old.name});}
    const r=await sg({action:"getUsers"});
    if(r.ok&&r.users)setUsers(r.users);
    setToast("Users saved ✓");
  };

  const updateSheetLink=(url)=>{
    try{localStorage.setItem("medexam_sheet",url);}catch{}
    setSheetLink(url);setToast("Saved ✓");
  };

  const backFromSettings=()=>{
    if(topic&&subject)setPage("questions");
    else if(subject)setPage("topics");
    else setPage("subjects");
  };

  if(!ready||loading)return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:C.bg,gap:16}}>
    <Spin/>{loading&&<p style={{color:C.sub,fontSize:15}}>{loading}</p>}
  </div>;

  return <div style={{...S.app,userSelect:"none",WebkitUserSelect:"none"}}>
    {user&&<Watermark name={user.name}/>}
    {toast&&<Toast msg={toast} onClose={()=>setToast("")}/>}
    {page==="login"&&<LoginPage users={users} onLogin={u=>{setUser(u);setPage("subjects");loadSubjects();}}/>}
    {page==="subjects"&&user&&<SubjectsPage subjects={subjects} onSelect={s=>{setSubject(s);setPage("topics");}} onAdd={addSubject} onDelete={delSubject} onSettings={()=>setPage("settings")}/>}
    {page==="topics"&&subject&&<TopicsPage subject={subject} questions={questions} onBack={()=>setPage("subjects")} onTopic={t=>{setTopic(t);setPage("questions");loadQuestions(subject.name);}} onSettings={()=>setPage("settings")}/>}
    {page==="questions"&&subject&&topic&&<QuestionsPage subject={subject} topic={topic} questions={questions} me={user} onBack={()=>setPage("topics")} onAdd={addQuestion} onDelete={delQuestion} onRefresh={()=>loadQuestions(subject.name)} onSettings={()=>setPage("settings")}/>}
    {page==="settings"&&user&&<SettingsPage users={users} me={user} sheetLink={sheetLink} onBack={backFromSettings} onUpdateUsers={updateUsers} onUpdateSheetLink={updateSheetLink} onLogout={()=>{setUser(null);setSubject(null);setTopic(null);setQuestions([]);setPage("login");}}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
